<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#B71C1C">
<title>Auditoría Técnica · Mostaza</title>
<script>window.VT_VERSION = '2.1.1';</script>
<style>
/* CSS critico inline: se aplica en el primer render, antes de descargar app.css.
   Evita el flash blanco/negro (FOUC) mientras carga la hoja de estilos real. */
:root{--c-marca-oscuro:#B71C1C;--c-fondo:#F4F7F6}
html{background:var(--c-fondo)}
body{margin:0;background:var(--c-fondo);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
/* Barra superior de marca visible al instante, para que el arranque ya sea "de la marca". */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:60px;
  background:linear-gradient(135deg,#D32F2F 0%,#B71C1C 100%);z-index:1}
/* El contenido arranca oculto y se revela cuando el CSS real esta listo (clase vt-listo). */
body>*{opacity:0}
html.vt-listo body::before{display:none}
html.vt-listo body>*{opacity:1;transition:opacity .2s ease-out}
@media (prefers-reduced-motion:reduce){html.vt-listo body>*{transition:none}}
</style>
<script>
(function () {
  var v = encodeURIComponent(window.VT_VERSION);
  function revelar(){ document.documentElement.classList.add('vt-listo'); }
  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = 'css/app.css?v=' + v;
  css.onload = function () {
    window.VT_CSS_LISTO = true;
    document.dispatchEvent(new Event('vt:css'));
    revelar();
  };
  /* Fallback: si el CSS falla o tarda demasiado, revelamos igual para no dejar la pagina invisible. */
  css.onerror = revelar;
  document.head.appendChild(css);
  setTimeout(revelar, 3000);
  var archivos = [
    'js/paleta.js', 'js/config.js', 'js/storage.js', 'js/visita.js',
    'data/jefes.js', 'data/locales.js', 'data/checklist.js',
    'js/controles/registro.js', 'js/controles/slider.js', 'js/controles/checklist.js',
    'js/controles/texto.js', 'js/controles/escala.js', 'js/controles/info.js', 'js/controles/agua.js',
    'js/scoring.js', 'js/fotos.js', 'js/firmas.js', 'js/pdf.js',
    'js/diagnostico.js', 'js/ui.js',
    'js/paneles/identificacion.js', 'js/paneles/local.js', 'js/paneles/recorrido.js',
    'js/paneles/firmas.js', 'js/paneles/informe.js',
    'vendor/jspdf.umd.min.js',
    'js/app.js'
  ];
  archivos.forEach(function (src) {
    var s = document.createElement('script');
    s.src = src + '?v=' + v; s.async = false;
    document.head.appendChild(s);
  });
})();
</script>
</head>
<body>
<header class="cabecera">
  <span class="logo-caja"><img class="logo-img" src="img/logo.png" alt="Mostaza" onerror="this.style.display='none';this.parentNode.classList.add('logo-caja--fallback');this.parentNode.textContent='M';"></span>
  <div class="cabecera__texto">
    <strong class="cabecera__titulo">Auditoría Técnica</strong>
    <span class="cabecera__contexto" id="cab-contexto">Sin visita iniciada</span>
  </div>
  <span class="semaforo semaforo--oculto" id="cab-semaforo" aria-hidden="true"></span>
</header>
<div class="aviso aviso--oculto" id="aviso-almacenamiento" role="alert"></div>
<main class="panel" id="panel" tabindex="-1"></main>
<footer class="pie">
  <span class="pie__texto">Mostaza — Control Interno Regional</span>
  <button type="button" class="pie__version" id="btn-version">v—</button>
</footer>
<nav class="barra" id="barra">
  <button type="button" class="barra__btn" id="btn-atras">Atrás</button>
  <span class="barra__progreso" id="barra-progreso">Paso 1 de 6</span>
  <button type="button" class="barra__btn barra__btn--principal" id="btn-siguiente">Siguiente</button>
</nav>
<div class="modal modal--oculto" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <div class="modal__caja" id="modal-caja"></div>
</div>
<noscript><p style="padding:16px;font-family:sans-serif">Esta aplicación necesita JavaScript activado.</p></noscript>
</body>
</html>
